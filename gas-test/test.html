<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별빛 탐사선 · 구글 시트 제출 테스트</title>
<style>
  body { font-family: sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 18px; margin-top: 4px; }
  .row { display: flex; gap: 12px; }
  .row label { flex: 1; }
  button { width: 100%; margin-top: 16px; padding: 14px; font-size: 20px; }
  #result { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 18px; white-space: pre-wrap; }
  .ok { background: #dff5e1; }
  .err { background: #fde2e2; }
  .wait { background: #eee; }
  small { color: #666; }
</style>
</head>
<body>
<h1>구글 시트 제출 테스트</h1>
<small>개발용 페이지입니다. 학생에게 보이는 화면이 아닙니다. 웹앱 주소는 이 브라우저에만 기억되고 파일에는 저장되지 않습니다.</small>

<label>웹앱 주소(끝이 /exec) <input id="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
<div class="row">
  <label>학년 <input id="grade" inputmode="numeric" value="4"></label>
  <label>반 <input id="class" inputmode="numeric" value="3"></label>
  <label>번호 <input id="number" inputmode="numeric" value="12"></label>
</div>
<label>이름 <input id="name" value="테스트" readonly></label>
<label>문항(미션 행) <input id="item" value="1-1"></label>
<label>행성(도감 행) <input id="planet" value="화성"></label>

<button id="sendMission">미션 행 보내기</button>
<button id="sendJournal">도감 행 보내기</button>
<div id="result" hidden></div>

<script>
const URL_KEY = 'starvoyager:test-webapp-url';
const $ = (id) => document.getElementById(id);

try { $('url').value = localStorage.getItem(URL_KEY) || ''; } catch (e) { /* 저장이 막혀 있으면 매번 붙여넣는다 */ }

function show(kind, text) {
  const box = $('result');
  box.hidden = false;
  box.className = kind;
  box.textContent = text;
}

function student() {
  return { grade: $('grade').value, class: $('class').value, number: $('number').value, name: $('name').value };
}

// 기획서 10-3 '미션' 탭 샘플(문항 1-1)
function missionPayload() {
  return {
    kind: '미션', ...student(), mission: 1, item: $('item').value,
    predicted: '지구', predictedCorrect: 'X', finalAnswer: '태양', finalCorrect: 'O',
    summary: '', summaryCorrect: '', seconds: 42, memo: '테스트'
  };
}

// 기획서 10-4 '도감' 탭 샘플(화성 카드)
function journalPayload() {
  return {
    kind: '도감', ...student(), planet: $('planet').value,
    colorFirst: '붉은색', colorFinal: '붉은색', colorCorrect: 'O',
    surfaceFirst: '기체', surfaceFinal: '단단한 땅', surfaceCorrect: 'O',
    ringFirst: '희미한 고리가 있어요', ringFinal: '고리가 없어요', ringCorrect: 'O',
    featuresFinal: '', featuresCorrect: 'O', landingTried: '예', seconds: 95
  };
}

async function send(payload, button) {
  const url = $('url').value.trim();
  if (!url) {
    show('err', '웹앱 주소가 비어 있어요. 맨 위 칸에 주소를 붙여넣어 주세요.');
    return;
  }
  try { localStorage.setItem(URL_KEY, url); } catch (e) { /* no-op */ }

  button.disabled = true;
  show('wait', '보내는 중…');
  try {
    // text/plain으로 보내면 브라우저가 사전 요청(preflight)을 보내지 않는다.
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      // JSON이 아닌 HTML이 오면 보통 구글 로그인 화면이나 권한 오류 화면이다.
      show('err', '답이 올바르지 않아요.\n웹앱의 액세스 권한이 "모든 사용자"인지, 주소 끝이 /exec인지 확인해 주세요.\n(받은 내용 앞부분: ' + text.slice(0, 80).replace(/\s+/g, ' ') + ')');
      return;
    }
    if (data.ok) {
      show('ok', '제출됐어요! 시트의 \'' + payload.kind + '\' 탭에 한 줄이 생겼는지 확인해 보세요.');
    } else {
      show('err', '제출하지 못했어요.\n이유: ' + (data.error || '알 수 없어요'));
    }
  } catch (e) {
    show('err', '서버에 연결하지 못했어요.\n인터넷 연결, 웹앱 주소, 웹앱 액세스 권한을 확인해 주세요.\n(' + e.message + ')');
  } finally {
    button.disabled = false;
  }
}

$('sendMission').addEventListener('click', (e) => send(missionPayload(), e.currentTarget));
$('sendJournal').addEventListener('click', (e) => send(journalPayload(), e.currentTarget));
</script>
</body>
</html>
