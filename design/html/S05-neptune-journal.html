<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>S05 해왕성 탐사 + 완성 카드</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body data-accent="neptune">
<script src="../icons/icons.js"></script>
<main class="sv-stage">

  <div class="sv-ph-planet" style="left:236px; top:168px; width:740px; height:740px; background:radial-gradient(circle at 34% 32%, #9DB8FF 0%, #4C77E8 30%, #2846B0 58%, #0E1A55 84%, #050A24 100%); box-shadow:0 0 90px rgba(61,107,224,.25)"></div>
  <div class="sv-ph-planet" style="left:146px; top:500px; width:920px; height:80px; border-radius:50%; border:1.5px solid rgba(160,185,255,.18)"></div>
  <p class="sv-ph-note" style="left:48px; bottom:150px; margin:0">3D 장면 자리 · 실제 앱에서는 Three.js로 그린 해왕성(희미한 고리)</p>

  <div class="sv-corner sv-corner--tl"></div><div class="sv-corner sv-corner--tr"></div>
  <div class="sv-corner sv-corner--bl"></div><div class="sv-corner sv-corner--br"></div>

  <header class="sv-hud-top">
    <div class="sv-glass sv-hud-cell"><span class="sv-hud-code">MISSION 02</span><span class="sv-hud-val">탐사 2 · 행성 탐사</span></div>
    <div class="sv-glass sv-hud-cell sv-hud-dest"><span class="sv-hud-key">목적지</span><span class="sv-hud-val">해왕성</span></div>
    <div class="sv-glass sv-hud-cell"><span class="sv-hud-key">도감</span><span class="sv-hud-num">6/8</span></div>
  </header>
  <div class="sv-hud-rule"></div>

  <nav class="sv-controls" aria-label="조작">
    <button class="sv-ctl"><svg aria-hidden="true"><use href="#i-map"/></svg>태양계 지도</button>
    <button class="sv-ctl"><svg aria-hidden="true"><use href="#i-prev"/></svg>이전 행성</button>
    <button class="sv-ctl" disabled><svg aria-hidden="true"><use href="#i-next"/></svg>다음 행성</button>
    <button class="sv-ctl"><svg aria-hidden="true"><use href="#i-land"/></svg>착륙하기</button>
    <button class="sv-ctl" aria-pressed="false"><svg aria-hidden="true"><use href="#i-ring"/></svg>고리 찾기</button>
    <button class="sv-ctl" aria-pressed="false"><svg aria-hidden="true"><use href="#i-label"/></svg>이름 보기</button>
    <button class="sv-ctl" aria-pressed="true"><svg aria-hidden="true"><use href="#i-journal"/></svg>도감</button>
  </nav>

  <section class="sv-panel sv-journal" aria-label="탐사 도감" style="gap:20px">
    <div class="sv-journal-head">
      <div class="sv-journal-title"><span class="sv-journal-kicker">탐사 도감</span><span class="sv-journal-name">해왕성</span></div>
      <span class="sv-tag sv-tag--done">완성</span>
    </div>

    <div style="position:relative">
      <dl class="sv-record" style="margin:0">
        <div class="sv-record-row"><dt>색깔</dt><dd><span class="sv-swatch sv-swatch--blue"></span>파란색</dd></div>
        <div class="sv-record-row"><dt>표면 상태</dt><dd>기체</dd></div>
        <div class="sv-record-row"><dt>고리</dt><dd>희미한 고리가 있어요</dd></div>
        <div class="sv-record-row"><dt>그 밖의 특징</dt><dd style="color:var(--sv-paper-soft); font-weight:400">고른 특징 없음</dd></div>
      </dl>
    </div>

    <div style="display:flex; align-items:center; gap:24px">
      <div class="sv-stamp" aria-label="완성 도장"><span class="sv-stamp-small">STAR VOYAGER</span><span class="sv-stamp-big">관찰 완료</span><span class="sv-stamp-small">06 / 08</span></div>
      <p class="sv-fact" style="margin:0; flex:1">해왕성은 파란색을 띠고, 희미한 고리가 있어요.</p>
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; padding:16px 18px; border-radius:var(--sv-radius); border:1.5px dashed var(--sv-option-line)">
      <span class="sv-section-title">행성 랩</span>
      <span style="font-size:var(--sv-fs-option); color:var(--sv-paper-soft)">탐사 2를 마치면 이 카드로 랩을 만들 수 있어요.</span>
    </div>

    <div style="margin-top:auto; display:flex; gap:12px">
      <button class="sv-secondary" style="flex:1"><svg aria-hidden="true" style="width:26px;height:26px"><use href="#i-prev"/></svg>도감 목차</button>
      <button class="sv-primary" style="flex:1.4"><svg aria-hidden="true"><use href="#i-present"/></svg>발표하기</button>
    </div>
  </section>
</main>
</body>
</html>
