<!doctype html>
<html lang="ko">

<title>S08 북쪽 밤하늘 · 별 잇기</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .lines { position:absolute; inset:0; pointer-events:none; }
  .done { stroke:var(--sv-accent); stroke-width:3; stroke-linecap:round; }
  .guide { stroke:rgba(232,236,246,.35); stroke-width:2; stroke-dasharray:4 10; stroke-linecap:round; }
  .art { fill:none; stroke:var(--sv-accent); stroke-opacity:.22; stroke-width:2; stroke-dasharray:2 8; }
</style>

<body data-accent="sky">
<script src="../icons/icons.js"></script>
<main class="sv-stage" style="background-color:#070B1F">

  <svg class="lines" viewBox="0 0 1920 1080" aria-hidden="true">

    <polyline class="done" fill="none" points="750,590 820,635 885,690 970,760"/>

    <polyline class="done" fill="none" points="1290,300 1350,370 1420,320"/>
    <!-- 작은곰자리: 점선 안내 -->
    <polyline class="guide" fill="none" points="960,360 930,430 905,490 890,545 950,575 932,640 870,615 890,545"/>
  </svg>

  <span class="sv-star" style="left:700px; top:480px; width:10px; height:10px"></span>

  <header class="sv-hud-top">
    <div class="sv-glass sv-hud-cell"><span class="sv-hud-code">MISSION 04</span><span class="sv-hud-val">탐사 4 · 북쪽 밤하늘</span></div>

  </header>
  <div class="sv-hud-rule"></div>

  <nav class="sv-controls" aria-label="조작" style="width:1840px">

    <button class="sv-ctl"><svg aria-hidden="true"><use href="#i-hint"/></svg>힌트</button>
